[project]
name = "layerlog"
version = "0.1.0"
description = "Log Bambu P2S prints to Notion with slicer settings, via Bambuddy webhooks"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
